spring.application.name=MES

spring.datasource.url=jdbc:mysql://localhost:3306/mes_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.mes.system=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration
server.port=8080

# Custom Properties - DEBUG FOCUS: Externalized configuration
app.orders.page-size=10
app.max-retry-attempts=3
app.inventory.threshold=100